name: Feature request
description: Suggest an improvement to a workflow or interaction
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the current workflow and where it becomes difficult.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Suggested improvement
      description: Explain the behavior you would find useful, with an example if possible.
    validations:
      required: true
