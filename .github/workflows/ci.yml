name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v7
      - name: Install Qt and X11 runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libopengl0 libgl1 libxkbcommon0 libxcb-cursor0 xvfb xauth
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -c requirements.lock -e '.[dev]'
      - run: ruff check src tests
      - run: ruff format --check src tests
      - run: xvfb-run -a env QT_QPA_PLATFORM=offscreen python -m pytest -q
      - run: python -m build
