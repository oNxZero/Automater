name: Bug report
description: Something isn’t working
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Automater version
      placeholder: 0.13.1
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Linux desktop and session
      placeholder: KDE Plasma, Wayland; Python and Qt versions if known
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Where does the problem happen?
      options:
        - Editor or file management
        - Recording
        - Test mode
        - Active desktop playback
        - Background window · X11
        - Separate game session · Gamescope
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: What happened?
      description: List the steps to reproduce, what you expected, and what happened instead. Use a small example without personal input.
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Optional diagnostics or screenshot
      description: Check for personal details before posting, including typed text, device names, window titles and file paths.
