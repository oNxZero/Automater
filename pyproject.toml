[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "automater"
version = "0.13.2"
description = "A native Linux input recorder and visual workflow editor"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "oNxZero"}]
license = "MIT"
classifiers = ["Operating System :: POSIX :: Linux", "Programming Language :: Python :: 3"]
dependencies = ["PySide6-Essentials>=6.11.2,<6.12", "evdev>=1.9,<2", "python-xlib>=0.33,<1", "dbus-next>=0.2.3,<1"]

[project.urls]
Homepage = "https://github.com/oNxZero/Automater"
Issues = "https://github.com/oNxZero/Automater/issues"
Documentation = "https://github.com/oNxZero/Automater/blob/main/docs/USER_GUIDE.md"

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-qt>=4.4,<5", "ruff>=0.12,<1", "build>=1.2,<2"]

[project.scripts]
automater = "automater.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
automater = ["assets/*.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
