name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v7
      - name: Install Qt and X11 runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libopengl0 libgl1 libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-xinerama0 libxcb1 libx11-xcb1 libxcb-shape0 libxcb-randr0 libxcb-render0 libxcb-render-util0 libxcb-shm0 libxcb-sync1 libxcb-xfixes0 libxcb-xkb1 xvfb xauth
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -c requirements.lock -e '.[dev]'
      - run: ruff check src tests scripts
      - run: ruff format --check src tests scripts
      - name: Check shell scripts and install application-menu entry
        run: |
          bash -n start.sh install.sh
          sh -n scripts/launch.sh
          XDG_DATA_HOME="$RUNNER_TEMP/automater-menu" ./install.sh --no-system-packages
      - run: xvfb-run -a env QT_QPA_PLATFORM=offscreen python -m pytest -q
      - run: python -m build
  native-displays:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - run: sudo apt-get update
      - run: sudo apt-get install -y --no-install-recommends libegl1 libopengl0 libgl1 libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-xinerama0 libxcb1 libx11-xcb1 libxcb-shape0 libxcb-randr0 libxcb-render0 libxcb-render-util0 libxcb-shm0 libxcb-sync1 libxcb-xfixes0 libxcb-xkb1 libwayland-client0 libwayland-cursor0 libwayland-egl1 xvfb xauth weston
      - run: python -m pip install -c requirements.lock -e '.[dev]'
      - run: xvfb-run -a env QT_QPA_PLATFORM=offscreen python -m pytest -q tests/test_native_displays.py
  distro-smoke:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        image: [debian:bookworm, fedora:44]
    container: ${{ matrix.image }}
    steps:
      - name: Install Debian runtime
        if: startsWith(matrix.image, 'debian')
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates python3 python3-venv python3-dev gcc linux-libc-dev libegl1 libopengl0 libgl1 libxkbcommon0 libxcb-cursor0 fontconfig libfreetype6 libdbus-1-3 libglib2.0-0
      - name: Install Fedora runtime
        if: startsWith(matrix.image, 'fedora')
        run: dnf install -y git ca-certificates python3 python3-pip python3-devel gcc kernel-headers mesa-libEGL libglvnd-opengl mesa-libGL libxkbcommon libxcb xcb-util-cursor fontconfig freetype dejavu-sans-fonts dbus-libs
      - uses: actions/checkout@v7
      - run: python3 -m venv .venv
      - run: .venv/bin/python -m pip install -c requirements.lock -e '.[dev]'
      - run: QT_QPA_PLATFORM=offscreen .venv/bin/python -m pytest -q tests/test_compatibility.py tests/test_models_storage.py tests/test_rendering.py
      - run: QT_QPA_PLATFORM=offscreen .venv/bin/python scripts/smoke_gui.py
      - run: ./start.sh --doctor
      - name: Check application-menu registration without changing host settings
        run: XDG_DATA_HOME=/tmp/automater-menu .venv/bin/python -m automater.desktop --checkout "$PWD"
