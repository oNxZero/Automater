name: Feature request
description: Suggest a feature or improvement
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe where you get stuck with the current app.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Suggested improvement
      description: How would you like it to work? An example helps.
    validations:
      required: true
